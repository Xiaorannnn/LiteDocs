<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/">LiteDocs</a>
    <div class="who"><span id="whoName"></span><button id="logoutBtn" class="btn quiet">Sign out</button></div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="shareDialog" class="dialog"></dialog>
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
